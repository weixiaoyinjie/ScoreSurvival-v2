name: Build Score Survival APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract Source ZIP
        shell: bash
        run: |
          if [ ! -f settings.gradle ]; then
            ZIP=$(find . -type f -iname '*OneUpload.zip' -print -quit)
            if [ -n "$ZIP" ]; then
              mkdir -p extracted
              unzip -o "$ZIP" -d extracted
            fi
          fi

      - name: Locate Gradle Project
        shell: bash
        run: |
          PROJECT=$(find . -type f \( -name settings.gradle -o -name settings.gradle.kts \) -print -quit)
          if [ -z "$PROJECT" ]; then
            echo "ERROR: Gradle project not found"
            exit 1
          fi
          DIR=$(realpath "$(dirname "$PROJECT")")
          echo "PROJECT_DIR=$DIR" >> "$GITHUB_ENV"
          echo "Project directory: $DIR"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK
        shell: bash
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export ANDROID_SDK_ROOT=$ANDROID_HOME
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -d "$ANDROID_HOME/platforms/android-35" ] || [ ! -d "$ANDROID_HOME/build-tools/35.0.0" ]; then
            "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0"
          fi

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        run: |
          cd "$PROJECT_DIR"
          gradle :app:assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ScoreSurvival-v2-APK
          path: ${{ env.PROJECT_DIR }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
